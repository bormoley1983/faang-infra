global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: faang-homelab
    environment: homelab

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']

  - job_name: grafana
    static_configs:
      - targets: ['grafana:3000']

  # Private, operator-owned files supply external Proxmox VM/LXC exporters and
  # any approved Kubernetes collector/gateway. Never commit physical targets.
  - job_name: private-file-discovery
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/*.local.json
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [job]
        target_label: source_job
      - target_label: placement
        replacement: external
