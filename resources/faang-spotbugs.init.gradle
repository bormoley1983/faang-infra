initscript {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
    dependencies {
        classpath 'com.github.spotbugs.snom:spotbugs-gradle-plugin:6.5.11'
    }
}

import org.gradle.api.GradleException
import com.github.spotbugs.snom.Confidence
import com.github.spotbugs.snom.Effort
import com.github.spotbugs.snom.SpotBugsPlugin
import com.github.spotbugs.snom.SpotBugsTask

def exclusionPath = System.getProperty('faang.spotbugs.exclude')
if (exclusionPath == null || exclusionPath.isBlank()) {
    throw new GradleException('Trusted SpotBugs exclusion path is required')
}
def exclusionFile = new File(exclusionPath)
if (!exclusionFile.isFile()) {
    throw new GradleException('Trusted SpotBugs exclusion file is missing')
}

allprojects { project ->
    project.plugins.withId('java') {
        project.pluginManager.apply(SpotBugsPlugin)

        project.spotbugs {
            toolVersion = '4.10.4'
            ignoreFailures = false
            showStackTraces = true
            effort = Effort.valueOf('MAX')
            reportLevel = Confidence.valueOf('MEDIUM')
            maxHeapSize = '1g'

            excludeFilter = exclusionFile
        }

        project.dependencies {
            spotbugsPlugins 'com.h3xstream.findsecbugs:findsecbugs-plugin:1.14.0'
        }

        project.tasks.withType(SpotBugsTask).configureEach {
            reports {
                xml.required = true
                html.required = true
            }
        }
    }
}
