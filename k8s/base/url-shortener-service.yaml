apiVersion: apps/v1
kind: Deployment
metadata:
  name: faang-url-shortener-service
  labels:
    app: faang-url-shortener-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: faang-url-shortener-service
  template:
    metadata:
      labels:
        app: faang-url-shortener-service
    spec:
      containers:
        - name: url-shortener-service
          image: docker-registry:5000/faang-url-shortener-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 18080
          env:
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: faang-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: faang-config
                  key: POSTGRES_PORT
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: faang-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: faang-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: faang-config
                  key: POSTGRES_DB
            - name: DATABASE_URL
              value: "jdbc:postgresql://$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"
            - name: DATABASE_USERNAME
              value: "$(POSTGRES_USER)"
            - name: DATABASE_PASSWORD
              value: "$(POSTGRES_PASSWORD)"
            - name: DATABASE_SCHEMA
              value: "url_shortener_service"
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: faang-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: faang-config
                  key: REDIS_PORT
            - name: URL_SHORTENER_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: faang-config
                  key: URL_SHORTENER_BASE_URL
            - name: URL_SHORTENER_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: faang-config
                  key: URL_SHORTENER_PUBLIC_URL
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 18080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 18080
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: faang-url-shortener-service
spec:
  selector:
    app: faang-url-shortener-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 18080
  type: ClusterIP
