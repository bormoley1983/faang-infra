resources:
  - configmap.yaml
  - ingress.yaml
  - application-metrics-network-policy.yaml
  - account-service.yaml
  - achievement-service.yaml
  - analytics-service.yaml
  - notification-service.yaml
  - payment-service.yaml
  - post-service.yaml
  - project-service.yaml
  - url-shortener-service.yaml
  - user-service.yaml

patches:
  - path: application-deployment-defaults.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: faang-.*-service
  - path: application-service-metrics.yaml
    target:
      version: v1
      kind: Service
      name: faang-.*-service
