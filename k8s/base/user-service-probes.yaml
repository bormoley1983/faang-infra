- op: replace
  path: /spec/template/spec/containers/0/startupProbe
  value:
    tcpSocket:
      port: http
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 30
- op: replace
  path: /spec/template/spec/containers/0/livenessProbe
  value:
    tcpSocket:
      port: http
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
- op: replace
  path: /spec/template/spec/containers/0/readinessProbe
  value:
    tcpSocket:
      port: http
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
