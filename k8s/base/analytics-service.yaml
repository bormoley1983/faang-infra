apiVersion: apps/v1
kind: Deployment
metadata:
  name: faang-analytics-service
  labels:
    app: faang-analytics-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: faang-analytics-service
  template:
    metadata:
      labels:
        app: faang-analytics-service
    spec:
      containers:
        - name: analytics-service
          image: docker-registry:5000/faang-analytics-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8086
          env:
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: faang-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: faang-config
                  key: POSTGRES_PORT
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: faang-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: faang-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: faang-config
                  key: POSTGRES_DB
            - name: DATABASE_URL
              value: "jdbc:postgresql://$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"
            - name: DATABASE_USERNAME
              value: "$(POSTGRES_USER)"
            - name: DATABASE_PASSWORD
              value: "$(POSTGRES_PASSWORD)"
            - name: DATABASE_SCHEMA
              value: "analytics_service"
            - name: KAFKA_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: faang-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: faang-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: faang-config
                  key: REDIS_PORT
            - name: PROJECT_SERVICE_HOST
              valueFrom:
                configMapKeyRef:
                  name: faang-config
                  key: PROJECT_SERVICE_HOST
            - name: PROJECT_SERVICE_PORT
              valueFrom:
                configMapKeyRef:
                  name: faang-config
                  key: PROJECT_SERVICE_PORT
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8086
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8086
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: faang-analytics-service
spec:
  selector:
    app: faang-analytics-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8086
  type: ClusterIP
