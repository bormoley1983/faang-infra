apiVersion: apps/v1
kind: Deployment
metadata:
  name: faang-user-service
  labels:
    app: faang-user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: faang-user-service
  template:
    metadata:
      labels:
        app: faang-user-service
    spec:
      containers:
        - name: user-service
          image: docker-registry:5000/faang-user-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: faang-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: faang-config
                  key: POSTGRES_PORT
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: faang-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: faang-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: faang-config
                  key: POSTGRES_DB
            - name: DATABASE_URL
              value: "jdbc:postgresql://$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"
            - name: DATABASE_USERNAME
              value: "$(POSTGRES_USER)"
            - name: DATABASE_PASSWORD
              value: "$(POSTGRES_PASSWORD)"
            - name: DATABASE_SCHEMA
              value: "user_service"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: faang-user-service
spec:
  selector:
    app: faang-user-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
