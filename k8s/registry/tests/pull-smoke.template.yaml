apiVersion: v1
kind: Pod
metadata:
  name: dep020-pull-amd64
  namespace: faang
spec:
  restartPolicy: Never
  imagePullSecrets:
    - name: faang-registry-pull
  nodeSelector:
    kubernetes.io/arch: amd64
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: smoke
      image: __REGISTRY_ENDPOINT__/faang/dep020-smoke@sha256:a4c54befd87d0366e0ba3ac3a9536a5288c8a3735acd3b635cdace59a2c559c8
      args:
        - version
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
---
