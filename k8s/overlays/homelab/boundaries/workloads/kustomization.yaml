apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: faang
resources:
  - resources/ingress.yaml
  - resources/application-metrics-network-policy.yaml
  - resources/account-service.yaml
  - resources/achievement-service.yaml
  - resources/analytics-service.yaml
  - resources/notification-service.yaml
  - resources/payment-service.yaml
  - resources/post-service.yaml
  - resources/project-service.yaml
  - resources/url-shortener-service.yaml
  - resources/user-service.yaml
patches:
  - path: application-deployment-defaults.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: faang-.*-service
  - path: application-service-metrics.yaml
    target:
      version: v1
      kind: Service
      name: faang-.*-service
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: faang-ingress
images:
  - name: docker-registry:5000/faang-account-service
