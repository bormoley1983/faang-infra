apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - service.yaml

generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/part-of: faang-dependencies
    faang.io/dependency: kafka
    faang.io/dependency-mode: external
  annotations:
    argocd.argoproj.io/sync-wave: "-49"

configMapGenerator:
  - name: faang-dependency-kafka-selection
    namespace: faang
    literals:
      - mode=external
