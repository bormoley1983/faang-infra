namespace: faang

resources:
  - namespace.yaml
  - ../../base

patches:
  - path: configmap.yaml
    target:
      kind: ConfigMap
      name: faang-config
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: faang-ingress

images:
  - name: docker-registry:5000/faang-account-service
    newTag: bootstrap
  - name: docker-registry:5000/faang-achievement-service
    newTag: bootstrap
  - name: docker-registry:5000/faang-analytics-service
    newTag: bootstrap
  - name: docker-registry:5000/faang-notification-service
    newTag: bootstrap
  - name: docker-registry:5000/faang-payment-service
    newTag: bootstrap
  - name: docker-registry:5000/faang-post-service
    newTag: bootstrap
  - name: docker-registry:5000/faang-project-service
    newTag: bootstrap
  - name: docker-registry:5000/faang-url-shortener-service
    newTag: bootstrap
