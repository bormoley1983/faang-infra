namespace: faang

resources:
  - namespace.yaml
  - ../../base
  - ../../bootstrap
  - ../../components/dependencies/postgresql/external
  - ../../components/dependencies/redis/external
  - ../../components/dependencies/elasticsearch/external
  - ../../components/dependencies/kafka/external
