apiVersion: v1
kind: ConfigMap
metadata:
  name: faang-config
data:
  # Existing homelab stateful endpoints. DEP-040 will make each independently selectable.
  POSTGRES_HOST: "postgres-main"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "faang"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-main:9092"
  REDIS_HOST: "redis-main"
  REDIS_PORT: "6379"
  ELASTICSEARCH_URL: "http://elasticsearch-main:9200"
  MINIO_URL: "http://minio-main:9000"
  MINIO_BUCKET_NAME: "corpbucket"
  S3_ENDPOINT: "http://minio-main:9000"
  S3_BUCKET_NAME: "corpbucket"
  S3_AVATAR_BUCKET_NAME: "user-avatars"
  S3_REGION: "us-east-1"
  S3_DOWNLOAD_PATH: "/api/v1/buckets/corpbucket/objects/download?preview=true&prefix="
  APP_ENV: "production"
  URL_SHORTENER_BASE_URL: "http://faang-url-shortener.office.aviv.com.ua"
  URL_SHORTENER_PUBLIC_URL: "http://faang-url-shortener.office.aviv.com.ua/url"
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  VONAGE_API_SENDER: "FaangTestBot"
  TELEGRAM_BOT_NAME: "@FaangTestBot"
