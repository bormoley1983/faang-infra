apiVersion: v1
kind: ConfigMap
metadata:
  name: faang-config
  namespace: default
data:
  # Infrastructure
  POSTGRES_HOST: "your-postgres-host"
  POSTGRES_PORT: "5432"
  KAFKA_BOOTSTRAP_SERVERS: "your-kafka-host:9092"
  REDIS_HOST: "your-redis-host"
  REDIS_PORT: "6379"
  ELASTICSEARCH_URL: "http://your-elasticsearch-host:9200"
  MINIO_URL: "http://your-minio-host:9000"
  APP_ENV: "production"

  # Internal Service URLs (ClusterIP services)
  ACCOUNT_SERVICE_URL: "http://account-service"
  ACHIEVEMENT_SERVICE_URL: "http://achievement-service"
  ANALYTICS_SERVICE_URL: "http://analytics-service"
  NOTIFICATION_SERVICE_URL: "http://notification-service"
  PAYMENT_SERVICE_URL: "http://payment-service"
  POST_SERVICE_URL: "http://post-service"
  PROJECT_SERVICE_URL: "http://project-service"
  URL_SHORTENER_SERVICE_URL: "http://url-shortener-service"
  USER_SERVICE_URL: "http://user-service" # Assuming this exists or will exist

  # External Integrations
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  VONAGE_API_SENDER: "Vonage API"
  TELEGRAM_BOT_NAME: "@YourBot"

