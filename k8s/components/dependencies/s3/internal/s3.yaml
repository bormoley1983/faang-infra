apiVersion: v1
kind: Service
metadata:
  name: s3-main
  namespace: faang
  labels:
    app.kubernetes.io/name: s3
    app.kubernetes.io/component: object-storage
    app.kubernetes.io/managed-by: argocd
    faang.io/dependency: s3
    faang.io/dependency-mode: internal
  annotations:
    argocd.argoproj.io/sync-wave: "-49"
spec:
  selector:
    app.kubernetes.io/name: s3
  ports:
    - name: api
      port: 9000
      targetPort: api
    - name: filer
      port: 8888
      targetPort: filer
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: s3-main
  namespace: faang
  labels:
    app.kubernetes.io/name: s3
    app.kubernetes.io/component: object-storage
    app.kubernetes.io/managed-by: argocd
    faang.io/dependency: s3
    faang.io/dependency-mode: internal
  annotations:
    argocd.argoproj.io/sync-wave: "-49"
spec:
  serviceName: s3-main
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: s3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: s3
        app.kubernetes.io/component: object-storage
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: s3
          image: chrislusf/seaweedfs:4.45@sha256:fc9f76fa993ad69966ffeb2f65d0318fcae39c6f8e20cf68ef7b3a5cb97769e5
          imagePullPolicy: IfNotPresent
          args:
            - mini
            - -dir=/data
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: faang-secrets
                  key: S3_ACCESS_KEY
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: faang-secrets
                  key: S3_SECRET_KEY
          ports:
            - name: api
              containerPort: 8333
            - name: filer
              containerPort: 8888
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            tcpSocket:
              port: api
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: api
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: api
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 20Gi
