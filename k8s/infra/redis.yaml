apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-main
  namespace: default
  labels:
    app: redis-main
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-main
  template:
    metadata:
      labels:
        app: redis-main
    spec:
      containers:
        - name: redis
          image: redis:latest
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-main
  namespace: default
spec:
  selector:
    app: redis-main
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
