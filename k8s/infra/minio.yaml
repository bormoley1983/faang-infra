apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio-main
  namespace: default
  labels:
    app: minio-main
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio-main
  template:
    metadata:
      labels:
        app: minio-main
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          ports:
            - containerPort: 9000
            - containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              value: "user"
            - name: MINIO_ROOT_PASSWORD
              value: "password"
          command: ["server", "--console-address", ":9001", "/data"]
          volumeMounts:
            - name: minio-data
              mountPath: /data
      volumes:
        - name: minio-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: minio-main
  namespace: default
spec:
  selector:
    app: minio-main
  ports:
    - name: api
      protocol: TCP
      port: 9000
      targetPort: 9000
    - name: console
      protocol: TCP
      port: 9001
      targetPort: 9001
