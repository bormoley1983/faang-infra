apiVersion: apps/v1
kind: Deployment
metadata:
  name: faang-project-service
  namespace: default
  labels:
    app: project-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: project-service
  template:
    metadata:
      labels:
        app: project-service
    spec:
      containers:
        - name: project-service
          image: your-registry/faang-project-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: faang-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: faang-config
                  key: POSTGRES_PORT
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: faang-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: faang-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "jdbc:postgresql://$(POSTGRES_HOST):$(POSTGRES_PORT)/postgres"
            - name: DATABASE_USERNAME
              value: "$(POSTGRES_USER)"
            - name: DATABASE_PASSWORD
              value: "$(POSTGRES_PASSWORD)"
            - name: DATABASE_SCHEMA
              value: "project_service"
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: faang-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: faang-config
                  key: REDIS_PORT
            - name: MINIO_SERVICE_HOST
              valueFrom:
                configMapKeyRef:
                  name: faang-config
                  key: MINIO_URL
            - name: PAYMENT_SERVICE_HOST
              value: "payment-service"
            - name: USER_SERVICE_HOST
              value: "user-service"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: project-service
  namespace: default
spec:
  selector:
    app: project-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8082
  type: ClusterIP
