apiVersion: batch/v1
kind: Job
metadata:
  name: faang-bootstrap-postgres-v1
  labels:
    app.kubernetes.io/name: faang-bootstrap-postgres
    app.kubernetes.io/component: bootstrap
    faang.io/bootstrap-contract: v1
  annotations:
    argocd.argoproj.io/sync-wave: "-40"
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: faang-bootstrap-postgres
        app.kubernetes.io/component: bootstrap
    spec:
      serviceAccountName: faang-bootstrap
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: bootstrap
          image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/scripts/init-postgres.sh"]
          env:
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: faang-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: faang-config
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: faang-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: faang-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: faang-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: faang-bootstrap-scripts-v1
            defaultMode: 0555
---
