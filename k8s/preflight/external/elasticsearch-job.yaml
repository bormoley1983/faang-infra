apiVersion: batch/v1
kind: Job
metadata:
  name: faang-external-preflight-elasticsearch
  labels:
    app.kubernetes.io/name: faang-external-preflight
    app.kubernetes.io/component: preflight
    faang.io/dependency: elasticsearch
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 330
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: faang-external-preflight
        app.kubernetes.io/component: preflight
        faang.io/dependency: elasticsearch
    spec:
      serviceAccountName: faang-external-preflight
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: preflight
          image: curlimages/curl:8.21.0@sha256:7c12af72ceb38b7432ab85e1a265cff6ae58e06f95539d539b654f2cfa64bb13
          command: ["/bin/sh", "/scripts/preflight-elasticsearch.sh"]
          env:
            - name: HOME
              value: /tmp
            - name: ELASTICSEARCH_URL
              valueFrom: {configMapKeyRef: {name: faang-config, key: ELASTICSEARCH_URL}}
            - name: ELASTICSEARCH_TLS_INSECURE
              valueFrom: {configMapKeyRef: {name: faang-config, key: ELASTICSEARCH_TLS_INSECURE}}
            - name: ELASTICSEARCH_USERNAME
              valueFrom: {secretKeyRef: {name: faang-secrets, key: ELASTICSEARCH_USERNAME}}
            - name: ELASTICSEARCH_PASSWORD
              valueFrom: {secretKeyRef: {name: faang-secrets, key: ELASTICSEARCH_PASSWORD}}
          resources:
            requests: {cpu: 25m, memory: 16Mi}
            limits: {cpu: 250m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: scripts, mountPath: /scripts, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: scripts
          configMap: {name: faang-external-preflight-scripts, defaultMode: 0555}
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
