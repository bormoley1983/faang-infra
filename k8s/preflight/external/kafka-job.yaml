apiVersion: batch/v1
kind: Job
metadata:
  name: faang-external-preflight-kafka
  labels:
    app.kubernetes.io/name: faang-external-preflight
    app.kubernetes.io/component: preflight
    faang.io/dependency: kafka
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 330
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: faang-external-preflight
        app.kubernetes.io/component: preflight
        faang.io/dependency: kafka
    spec:
      serviceAccountName: faang-external-preflight
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: preflight
          image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
          command: ["/bin/bash", "/scripts/preflight-kafka.sh"]
          env:
            - name: HOME
              value: /tmp
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom: {configMapKeyRef: {name: faang-config, key: KAFKA_BOOTSTRAP_SERVERS}}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: scripts, mountPath: /scripts, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: scripts
          configMap: {name: faang-external-preflight-scripts, defaultMode: 0555}
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
