apiVersion: batch/v1
kind: Job
metadata:
  name: faang-external-preflight-s3
  labels:
    app.kubernetes.io/name: faang-external-preflight
    app.kubernetes.io/component: preflight
    faang.io/dependency: s3
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 330
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: faang-external-preflight
        app.kubernetes.io/component: preflight
        faang.io/dependency: s3
    spec:
      serviceAccountName: faang-external-preflight
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: preflight
          image: amazon/aws-cli@sha256:b6aeb95d19d7f5a8cae4eb814cb16739b6b2a4f2f46f427ada6a8c9a20d9881d
          entrypoint: ["sh", "-c"]
          command: ["/scripts/preflight-s3.sh"]
          env:
            - name: HOME
              value: /tmp
            - name: S3_ENDPOINT
              valueFrom: {configMapKeyRef: {name: faang-config, key: S3_ENDPOINT}}
            - name: S3_BUCKET_NAME
              valueFrom: {configMapKeyRef: {name: faang-config, key: S3_BUCKET_NAME}}
            - name: S3_AVATAR_BUCKET_NAME
              valueFrom: {configMapKeyRef: {name: faang-config, key: S3_AVATAR_BUCKET_NAME}}
            - name: S3_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: faang-secrets, key: S3_ACCESS_KEY}}
            - name: S3_SECRET_KEY
              valueFrom: {secretKeyRef: {name: faang-secrets, key: S3_SECRET_KEY}}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: scripts, mountPath: /scripts, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: scripts
          configMap: {name: faang-external-preflight-scripts, defaultMode: 0555}
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
