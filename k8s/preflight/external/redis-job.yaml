apiVersion: batch/v1
kind: Job
metadata:
  name: faang-external-preflight-redis
  labels:
    app.kubernetes.io/name: faang-external-preflight
    app.kubernetes.io/component: preflight
    faang.io/dependency: redis
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: faang-external-preflight
        app.kubernetes.io/component: preflight
        faang.io/dependency: redis
    spec:
      serviceAccountName: faang-external-preflight
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: preflight
          image: redis:8-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
          command: ["/bin/sh", "/scripts/preflight-redis.sh"]
          env:
            - name: REDIS_HOST
              valueFrom: {configMapKeyRef: {name: faang-config, key: REDIS_HOST}}
            - name: REDIS_PORT
              valueFrom: {configMapKeyRef: {name: faang-config, key: REDIS_PORT}}
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: faang-secrets, key: REDIS_PASSWORD, optional: true}}
          resources:
            requests: {cpu: 25m, memory: 16Mi}
            limits: {cpu: 250m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: scripts, mountPath: /scripts, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: scripts
          configMap: {name: faang-external-preflight-scripts, defaultMode: 0555}
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
