apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jenkins-home-backup
  namespace: jenkins
  labels:
    app.kubernetes.io/name: jenkins-home-backup
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 8Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: jenkins-home-backup
  namespace: jenkins
  labels:
    app.kubernetes.io/name: jenkins-home-backup
spec:
  backoffLimit: 0
  suspend: true
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jenkins-home-backup
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: archive
          image: moby/buildkit:v0.30.0-rootless@sha256:d76eb1caecac5733ef7553c1e90a1b21f1bb218cd1142d3553de0747b4a14ba9
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
              archive="/backup/jenkins-home-$timestamp.tar.gz"
              tar -C /source -czf "$archive" .
              sha256sum "$archive" > "$archive.sha256"
              tar -tzf "$archive" | wc -l | awk '{print "archive_entries=" $1}'
              cat "$archive.sha256"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: source
              mountPath: /source
              readOnly: true
            - name: backup
              mountPath: /backup
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: source
          persistentVolumeClaim:
            claimName: jenkins
            readOnly: true
        - name: backup
          persistentVolumeClaim:
            claimName: jenkins-home-backup
        - name: tmp
          emptyDir: {}
