# Public, topology-neutral Jenkins controller values layered over private
# environment values. Keep endpoints, node names, credentials, and TLS material
# in the ignored homelab mapping/private environment repository.
controller:
  image:
    registry: docker.io
    repository: jenkins/jenkins
    tag: latest
    pullPolicy: Always

  admin:
    createSecret: true
    existingSecret: jenkins-admin-credentials
    userKey: jenkins-admin-user
    passwordKey: jenkins-admin-password
    password: ""

  # Resolve the latest plugins and dependencies on each controller restart.
  initializeOnce: false
  installLatestPlugins: true
  installLatestSpecifiedPlugins: true
  overwritePlugins: true
  overwritePluginsFromImage: true
  installPlugins:
    - antisamy-markup-formatter:latest
    - apache-httpcomponents-client-4-api:latest
    - asm-api:latest
    - authentication-tokens:latest
    - bootstrap5-api:latest
    - bouncycastle-api:latest
    - branch-api:latest
    - caffeine-api:latest
    - cloudbees-folder:latest
    - commons-lang3-api:latest
    - commons-text-api:latest
    - configuration-as-code:latest
    - credentials:latest
    - credentials-binding:latest
    - display-url-api:latest
    - durable-task:latest
    - font-awesome-api:latest
    - git:latest
    - git-client:latest
    - github:latest
    - github-api:latest
    - github-branch-source:latest
    - gson-api:latest
    - instance-identity:latest
    - ionicons-api:latest
    - jackson-annotations2-api:latest
    - jackson2-api:latest
    - jakarta-activation-api:latest
    - jakarta-mail-api:latest
    - jakarta-xml-bind-api:latest
    - javax-activation-api:latest
    - jaxb:latest
    - jjwt-api:latest
    - joda-time-api:latest
    - json-api:latest
    - json-path-api:latest
    - kubernetes:latest
    - kubernetes-client-api:latest
    - kubernetes-credentials:latest
    - mailer:latest
    - metrics:latest
    - mina-sshd-api-common:latest
    - mina-sshd-api-core:latest
    - okhttp-api:latest
    - pipeline-build-step:latest
    - pipeline-groovy-lib:latest
    - pipeline-input-step:latest
    - pipeline-milestone-step:latest
    - pipeline-model-api:latest
    - pipeline-model-definition:latest
    - pipeline-model-extensions:latest
    - pipeline-stage-step:latest
    - pipeline-stage-tags-metadata:latest
    - plain-credentials:latest
    - plugin-util-api:latest
    - prism-api:latest
    - scm-api:latest
    - script-security:latest
    - snakeyaml-api:latest
    - ssh-credentials:latest
    - structs:latest
    - token-macro:latest
    - variant:latest
    - woodstox-core-api:latest
    - workflow-aggregator:latest
    - workflow-api:latest
    - workflow-basic-steps:latest
    - workflow-cps:latest
    - workflow-durable-task-step:latest
    - workflow-job:latest
    - workflow-multibranch:latest
    - workflow-scm-step:latest
    - workflow-step-api:latest
    - workflow-support:latest

  JCasC:
    configScripts:
      faang-shared-library: |
        unclassified:
          globalLibraries:
            libraries:
              - name: faang-ci
                defaultVersion: dev-local
                allowVersionOverride: false
                implicit: false
                includeInChangesets: true
                retriever:
                  modernSCM:
                    scm:
                      gitSource:
                        remote: https://github.com/bormoley1983/faang-infra.git
