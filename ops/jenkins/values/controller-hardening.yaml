# Public, topology-neutral Jenkins controller values layered over private
# environment values. Keep endpoints, node names, credentials, and TLS material
# in the ignored homelab mapping/private environment repository.
controller:
  admin:
    createSecret: true
    existingSecret: jenkins-admin-credentials
    userKey: jenkins-admin-user
    passwordKey: jenkins-admin-password
    password: ""

  # Reconcile the exact lock on every restart. The full transitive lock avoids
  # jenkins-plugin-cli producing an inconsistent minimum-dependency graph.
  initializeOnce: false
  installLatestPlugins: false
  installLatestSpecifiedPlugins: false
  overwritePlugins: true
  overwritePluginsFromImage: true
