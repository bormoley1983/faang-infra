apiVersion: v1
kind: ServiceAccount
metadata:
  name: faang-buildkit-smoke
  namespace: jenkins
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: dep030-buildkit-amd64
  namespace: jenkins
  labels:
    app.kubernetes.io/name: faang-buildkit-smoke
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: faang-buildkit-smoke
        kubernetes.io/arch: amd64
    spec:
      serviceAccountName: faang-buildkit-smoke
      automountServiceAccountToken: false
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: Unconfined
      containers:
        - name: buildkit
          image: moby/buildkit:v0.30.0-rootless@sha256:d76eb1caecac5733ef7553c1e90a1b21f1bb218cd1142d3553de0747b4a14ba9
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              mkdir -p /workspace/context /workspace/layout
              printf '%s\n' \
                'FROM scratch' \
                'ARG TARGETARCH' \
                'LABEL io.faang.smoke.arch="${TARGETARCH}"' \
                'COPY marker.txt /marker.txt' > /workspace/context/Dockerfile
              printf '%s\n' 'rootless-buildkit-smoke' > /workspace/context/marker.txt
              buildctl-daemonless.sh build \
                --progress=plain \
                --frontend=dockerfile.v0 \
                --local context=/workspace/context \
                --local dockerfile=/workspace/context \
                --opt platform=linux/amd64,linux/arm64 \
                --opt attest:provenance=mode=max \
                --opt attest:sbom=generator=docker/buildkit-syft-scanner:stable-1@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9 \
                --output type=oci,dest=/workspace/image.tar
              tar -xf /workspace/image.tar -C /workspace/layout
              grep -R '"architecture"' /workspace/layout/index.json /workspace/layout/blobs/sha256
              grep -Rq '"architecture":"amd64"' /workspace/layout/blobs/sha256
              grep -Rq '"architecture":"arm64"' /workspace/layout/blobs/sha256
              echo 'ROOTLESS BUILDKIT PASS linux/amd64,linux/arm64'
          env:
            - name: BUILDKITD_FLAGS
              value: --oci-worker-no-process-sandbox --oci-worker-snapshotter=native
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            # rootlesskit requires the setuid newuidmap/newgidmap helpers.
            allowPrivilegeEscalation: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: Unconfined
            appArmorProfile:
              type: Unconfined
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: buildkit-state
              mountPath: /home/user/.local/share/buildkit
      volumes:
        - name: workspace
          emptyDir: {}
        - name: buildkit-state
          emptyDir: {}
---
