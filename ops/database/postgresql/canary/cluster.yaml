apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: faang-postgresql-canary
  namespace: faang-postgresql-canary
  labels:
    app.kubernetes.io/part-of: faang-postgresql
    faang.io/environment: canary
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4@sha256:6138f19539304b585c6cafd1af82ca407f184139459a8e06f0880df4556d3588
  imagePullPolicy: IfNotPresent
  enablePDB: false
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: canary
      owner: canary
      dataChecksums: true
  storage:
    storageClass: longhorn-production-retain
    size: 10Gi
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "1", memory: 2Gi}
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: faang-postgresql-backup
