apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: faang-secrets
  namespace: argocd
spec:
  description: Restricted SOPS/age runtime-secret delivery boundary
  sourceRepos:
    - 'https://github.com/bormoley1983/faang-infra-env-homelab.git'
  destinations:
    - namespace: faang
      server: 'https://kubernetes.default.svc'
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: ''
      kind: Secret
  orphanedResources:
    warn: true
