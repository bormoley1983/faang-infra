apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: faang-secrets
  namespace: argocd
spec:
  project: faang-secrets
  source:
    repoURL: 'https://github.com/bormoley1983/faang-infra-env-homelab.git'
    targetRevision: main
    path: overlays/homelab
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: faang
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
