apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: faang
  namespace: argocd
spec:
  description: FAANG application workloads managed from the faang-infra repository
  sourceRepos:
    - 'https://github.com/bormoley1983/faang-infra.git'
  destinations:
    - namespace: faang
      server: 'https://kubernetes.default.svc'
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  orphanedResources:
    warn: true
    # Runtime credentials are supplied outside Git and must not be adopted by
    # the application delivery boundary.
    ignore:
      - group: ''
        kind: Secret
        name: faang-secrets
      - group: ''
        kind: Secret
        name: faang-registry-pull
