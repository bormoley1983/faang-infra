apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: faang-kafka-canary
  namespace: argocd
spec:
  project: faang-kafka
  sources:
    - repoURL: 'quay.io/strimzi-helm'
      chart: strimzi-kafka-operator
      targetRevision: 1.2.0
      helm:
        releaseName: strimzi
        valueFiles:
          - $values/ops/kafka/operator-values.yaml
    - repoURL: 'https://github.com/bormoley1983/faang-infra.git'
      targetRevision: refs/heads/dev-local
      path: ops/kafka/manifests
    - repoURL: 'https://github.com/bormoley1983/faang-infra.git'
      targetRevision: refs/heads/dev-local
      path: ops/kafka/canary
    - repoURL: 'https://github.com/bormoley1983/faang-infra.git'
      targetRevision: refs/heads/dev-local
      ref: values
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: faang-kafka-system
  ignoreDifferences:
    # Kubernetes normalizes this preserved-unknown schema node by adding an
    # empty properties map. The chart omits it, so ignoring only that generated
    # field keeps the Application comparison meaningful.
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: kafkas.kafka.strimzi.io
      jsonPointers:
        - /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/kafka/properties/clusterSecurity/properties
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
