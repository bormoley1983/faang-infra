apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: faang-storage
  namespace: argocd
spec:
  description: Restricted platform-storage boundary for Longhorn
  sourceRepos:
    - 'https://charts.longhorn.io'
    - 'https://github.com/bormoley1983/faang-infra.git'
  destinations:
    - namespace: longhorn-system
      server: 'https://kubernetes.default.svc'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  orphanedResources:
    # Longhorn creates a large, dynamic control-plane inventory (volumes,
    # replicas, engines, settings, and recovery objects) outside the Helm
    # release tree. Keep it visible in Argo, but do not emit an Application
    # warning for every expected controller object.
    warn: false
