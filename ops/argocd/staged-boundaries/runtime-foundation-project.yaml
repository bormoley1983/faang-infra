apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: faang-runtime-foundation
  namespace: argocd
spec:
  description: Staged DEP-051 runtime namespace and configuration boundary
  sourceRepos:
    - 'https://github.com/bormoley1983/faang-infra.git'
  destinations:
    - namespace: faang
      server: 'https://kubernetes.default.svc'
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceWhitelist:
    - group: ''
      kind: ConfigMap
  orphanedResources:
    warn: true
