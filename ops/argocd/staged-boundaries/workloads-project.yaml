apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: faang-workloads
  namespace: argocd
spec:
  description: Staged DEP-051 FAANG workload delivery boundary
  sourceRepos:
    - 'https://github.com/bormoley1983/faang-infra.git'
    - 'https://github.com/bormoley1983/faang-infra-env-homelab.git'
  destinations:
    - namespace: faang
      server: 'https://kubernetes.default.svc'
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: ''
      kind: Service
    - group: apps
      kind: Deployment
    - group: networking.k8s.io
      kind: Ingress
  orphanedResources:
    warn: true
