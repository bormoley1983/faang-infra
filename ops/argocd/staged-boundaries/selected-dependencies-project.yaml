apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: faang-selected-dependencies
  namespace: argocd
spec:
  description: Staged DEP-051 dependency selection and external alias boundary
  sourceRepos:
    - 'https://github.com/bormoley1983/faang-infra.git'
  destinations:
    - namespace: faang
      server: 'https://kubernetes.default.svc'
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: ''
      kind: ConfigMap
    - group: ''
      kind: Service
  orphanedResources:
    warn: true
