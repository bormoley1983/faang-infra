apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: faang-postgresql
  namespace: argocd
spec:
  description: Restricted CloudNativePG operator and PostgreSQL recovery boundary
  sourceRepos:
    - 'https://cloudnative-pg.github.io/charts'
    - 'https://github.com/bormoley1983/faang-infra.git'
  destinations:
    - namespace: cnpg-system
      server: 'https://kubernetes.default.svc'
    - namespace: faang-postgresql-canary
      server: 'https://kubernetes.default.svc'
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  orphanedResources:
    warn: true
    # These are created by the deliberately separate backup bootstrap and by
    # the CNPG/Barman Cloud controllers, rather than by either Argo Application.
    # Keep this list exact so unexpected resources still raise a warning.
    ignore:
      - group: ''
        kind: ConfigMap
        name: cnpg-default-monitoring
      - group: ''
        kind: Secret
        name: faang-postgresql-backup-s3
      - group: ''
        kind: Secret
        name: barman-cloud-client-tls
      - group: ''
        kind: Secret
        name: barman-cloud-server-tls
      - group: barmancloud.cnpg.io
        kind: ObjectStore
        name: faang-postgresql-backup
      # Completed base-backup evidence is created out-of-band by the approved
      # recovery rehearsal and is deliberately retained for restore proof.
      - group: postgresql.cnpg.io
        kind: Backup
        name: canary-base-1
